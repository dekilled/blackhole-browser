<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pseudo</title><style>
body{font-family:sans-serif;margin:20px;background:#fff}
.q::before{content:"\201C";color:#7c3aed;font-size:28px}.q::after{content:"\201D";color:#7c3aed;font-size:28px}
a.ext::after{content:" \2197";color:#888}
li:first-child{font-weight:bold}
.badge::before{content:"";display:inline-block;width:10px;height:10px;border-radius:5px;background:#e11d48;margin-right:6px}
.tt::after{content:attr(data-tip);margin-left:8px;color:#0a7;font-size:12px}
.cf::after{content:"";display:block;clear:both}
</style></head><body>
<p class="q">Aspas geradas por CSS</p>
<p><a class="ext" href="#">link externo</a></p>
<ul><li>primeiro (negrito via :first-child)</li><li>segundo</li></ul>
<p class="badge">Ponto vermelho gerado</p>
<p class="tt" data-tip="dica via attr()">Passe o mouse</p>
</body></html>
