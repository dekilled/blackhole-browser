<!DOCTYPE html><html><head><meta charset="utf-8"><title>Visual</title>
<style>
body{margin:0;font-family:sans-serif;color:#eee;background:radial-gradient(circle at 80% 0%, #4c1d95 0%, #120d24 55%, #0b0814 100%)}
.wrap{padding:30px;display:flex;gap:24px;flex-wrap:wrap}
.card{width:200px;padding:18px;background:#1a1530;border:1px solid #3b2f8f;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.pill{display:inline-block;padding:8px 18px;border-radius:999px;background:linear-gradient(90deg,#7c3aed,#c084fc);color:#fff}
.circle{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#f472b6,#7c3aed)}
.sq{width:90px;height:60px;background:#2dd4bf;border-radius:4px 24px 4px 24px}
.ring{width:80px;height:80px;border:6px solid #a78bfa;border-radius:50%}
img{border-radius:20px;border:3px solid #fff}
</style></head><body><div class="wrap">
<div class="card"><h3 style="margin:0 0 8px">Cartão</h3>Cantos redondos, borda e sombra suave.</div>
<div><span class="pill">Botão gradiente</span></div>
<div class="circle"></div><div class="sq"></div><div class="ring"></div>
<img src="rose.png" width="110" alt="">
</div></body></html>
